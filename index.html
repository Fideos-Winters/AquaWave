<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AquaWave</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="panel">
      <header class="barra">
        AQUAWAVE STEREO
        <div class="controles">
          <button id="btn-min" aria-label="Minimizar">–</button>
          <button id="btn-cerrar" aria-label="Cerrar">×</button>
        </div>
      </header>

      <div class="contenido">
        <div class="lcd">
            
          <div class="fantasma">88:88</div>
          <div class="tiempo">00:00</div>
        </div>
        <div class="transporte">
  <button class="cromado" id="btn-anterior" aria-label="Anterior">
    <span class="brillo"></span>
    <svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 2v10M12 2L5 7l7 5z" fill="#26323f"/></svg>
  </button>

  <button class="cromado play" id="btn-play" aria-label="Reproducir o pausar">
    <span class="brillo"></span>
    <svg id="icono-play" width="14" height="14" viewBox="0 0 14 14"><path d="M3 1l10 6-10 6z" fill="#0f5a12"/></svg>
  </button>

  <button class="cromado" id="btn-stop" aria-label="Detener">
    <span class="brillo"></span>
    <svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" fill="#26323f"/></svg>
  </button>

  <button class="cromado" id="btn-siguiente" aria-label="Siguiente">
    <span class="brillo"></span>
    <svg width="14" height="14" viewBox="0 0 14 14"><path d="M11 2v10M2 2l7 5-7 5z" fill="#26323f"/></svg>
  </button>
</div>
        
      </div>
      
    </section>

    
  </main>

  <script src="renderer.js"></script>
</body>
</html>
