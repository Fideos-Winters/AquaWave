<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AquaWave</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Filtro de ruido para la textura de metal (no se ve, solo se define) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="grano">
      <feTurbulence type="fractalNoise" baseFrequency=".9 .04" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </svg>

  <main>

    <!-- ========== PANEL 1: REPRODUCTOR ========== -->
    <section class="panel">
      <header class="barra">
        AQUAWAVE STEREO
        <div class="controles">
          <button id="btn-min" aria-label="Minimizar">–</button>
          <button id="btn-cerrar" aria-label="Cerrar">×</button>
        </div>
      </header>

      <div class="contenido">
        <div class="fila">
          <div class="lcd lcd-tiempo">
            <div class="fantasma">88:88</div>
            <div class="tiempo" id="tiempo">00:00</div>
            <div class="sub">STEREO</div>
          </div>
          <div class="lcd lcd-info">
            <div class="titulo" id="titulo">Agrega música para empezar</div>
            <div class="espectro" id="espectro"></div>
          </div>
        </div>

        <div class="carril" id="barra-progreso">
          <div class="relleno" id="relleno-progreso"></div>
        </div>

        <div class="fila centrada">
          <button class="cromado" id="btn-anterior" aria-label="Anterior">
            <span class="brillo"></span>
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 2v10M12 2L5 7l7 5z" fill="#26323f"/></svg>
          </button>
          <button class="cromado play" id="btn-play" aria-label="Reproducir o pausar">
            <span class="brillo"></span>
            <svg id="icono-play" width="14" height="14" viewBox="0 0 14 14"><path d="M3 1l10 6-10 6z" fill="#0f5a12"/></svg>
          </button>
          <button class="cromado" id="btn-stop" aria-label="Detener">
            <span class="brillo"></span>
            <svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" fill="#26323f"/></svg>
          </button>
          <button class="cromado" id="btn-siguiente" aria-label="Siguiente">
            <span class="brillo"></span>
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M11 2v10M2 2l7 5-7 5z" fill="#26323f"/></svg>
          </button>

          <span class="espacio"></span>
          <span class="etiqueta">VOL</span>
          <div class="carril carril-vol" id="barra-volumen">
            <div class="relleno" id="relleno-volumen" style="width: 70%"></div>
          </div>
        </div>

        <div class="fila centrada">
          <span class="etiqueta">FUENTE</span>
          <button class="btn-s led">LOCAL</button>
          <button class="btn-s" disabled title="Próximamente">YOUTUBE</button>
          <button class="btn-s" disabled title="Próximamente">SPOTIFY</button>
        </div>
      </div>
    </section>

    <!-- ========== PANEL 2: ECUALIZADOR ========== -->
    <section class="panel">
      <header class="barra">ECUALIZADOR</header>
      <div class="contenido ecualizador" id="ecualizador"></div>
    </section>

    <!-- ========== PANEL 3: LISTA ========== -->
    <section class="panel panel-lista">
      <header class="barra">LISTA DE REPRODUCCIÓN</header>

      <div class="lista" id="lista">
        <!-- Filas de ejemplo: las borraremos cuando la lista la genere JavaScript -->
        <div class="pista activa"><span class="num">01.</span><span class="nombre">Nombre de la canción</span></div>
        <div class="pista"><span class="num">02.</span><span class="nombre">Canción 02 · Artista</span></div>
        <div class="pista"><span class="num">03.</span><span class="nombre">Canción 03 · Artista</span></div>
      </div>

      <div class="pie">
        <button class="btn-s" id="btn-agregar">+ Agregar</button>
        <button class="btn-s" id="btn-vaciar">Vaciar</button>
        <span class="etiqueta contador" id="contador">3 PISTAS</span>
      </div>
    </section>

  </main>

  <script src="renderer.js"></script>
</body>
</html>
